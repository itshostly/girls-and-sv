<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Girls& Panel</title>
<link rel="icon" type="image/png" href="brand/favicon-64.png">
<link rel="apple-touch-icon" href="brand/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: operations panel — meetup picker on top, money/seat summary, then the guest list with one-tap WhatsApp actions. */
:root{
  --matcha:#CFE1B9; --matcha-ink:#4F6B35; --strawberry:#F7D6DE; --rose:#B66A52; --rose-ink:#94513C;
  --butter:#FFF4D6; --butter-ink:#7A5A1E; --terracotta:#C85A3F; --espresso:#2E282A; --muted:#6E6266;
  --line:#EADFDC; --bg:#F7F2EF; --surface:#fff; --sky:#DCEBF2; --sky-ink:#3C6A80;
  --display:"Fraunces", Georgia, serif; --body:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--espresso);font:15px/1.5 var(--body)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn-primary{background:var(--rose);border-color:var(--rose);color:#fff}
.btn-primary:hover{background:var(--rose-ink)}
.btn-dark{background:var(--espresso);border-color:var(--espresso);color:#fff}
.btn-wa{background:#1F9D55;border-color:#1F9D55;color:#fff}
.btn-sm{padding:5px 9px;font-size:13px;border-radius:8px}
.input{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px}
.input:focus{outline:none;border-color:var(--rose)}
label.f{display:grid;gap:5px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
label.f .input{text-transform:none;letter-spacing:0;font-weight:400;color:var(--espresso);font-size:15px}

header{background:var(--espresso);color:#fff}
header .wrap{display:flex;align-items:center;gap:14px;height:62px}
header h1{font-size:20px}
header h1 em{color:var(--strawberry);font-style:normal}
header h1.hl{display:flex;align-items:flex-end;font-weight:600;font-size:22px}
header h1.hl img{height:28px;width:auto;margin:0 0 -2px 1px}
header .tagp{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#C9BDB9;border:1px solid #5a5052;border-radius:999px;padding:4px 10px}
header .sp{flex:1}
header .who{font-size:13px;color:#C9BDB9}
header .btn{background:transparent;color:#fff;border-color:#5a5052}

.login{max-width:400px;margin:70px auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px;display:grid;gap:14px}
.login p{margin:0;color:var(--muted);font-size:14px}
.msg{font-size:14px;font-weight:600;color:var(--terracotta)}
.msg.ok{color:var(--matcha-ink)}

.tabs{display:flex;gap:6px;margin:22px 0 18px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:9px 14px;border-radius:10px;font-weight:700;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--espresso);box-shadow:0 0 0 1px var(--line)}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:16px}
.bar .grow{flex:1;min-width:240px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font:700 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.meter{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px;display:flex}
.meter i{display:block;height:100%}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}

.venue{background:var(--butter);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:16px;color:var(--butter-ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);background:#FCFAF9;white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.code{font-family:ui-monospace,Menlo,monospace;font-weight:700;white-space:nowrap}
td .acts{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.s-pending{background:var(--butter);color:var(--butter-ink)}
.s-paid{background:var(--matcha);color:var(--matcha-ink)}
.s-waitlist{background:var(--sky);color:var(--sky-ink)}
.s-cancelled{background:#EEE7E5;color:var(--muted)}
.s-attended{background:var(--espresso);color:#fff}
.s-no_show{background:#F5D9D2;color:var(--terracotta)}
.late{color:var(--terracotta);font-weight:700;font-size:12px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.small{font-size:12px;color:var(--muted)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}
.formcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:14px;max-width:820px}
.mlist{display:grid;gap:10px;margin-bottom:22px}
.mrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.mrow .grow{flex:1;min-width:200px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--espresso);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:50}
</style>
</head>
<body>
<header><div class="wrap"><h1 class="hl">girls<img src="brand/mark.png" alt="&amp;" width="205" height="236"></h1><span class="tagp">Panel de reservas</span><span class="sp"></span><span class="who" id="who"></span><button class="btn btn-sm" id="logout" hidden>Salir</button></div></header>

<div class="wrap">
  <form class="login" id="login" hidden>
    <h2>Entrar al panel</h2>
    <p>Solo las organizadoras registradas pueden ver las reservas.</p>
    <label class="f">Correo<input class="input" id="l-email" type="email" autocomplete="username" required></label>
    <label class="f">Contraseña<input class="input" id="l-pass" type="password" autocomplete="current-password" minlength="8" required></label>
    <div class="msg" id="l-msg"></div>
    <button class="btn btn-primary" type="submit" style="justify-content:center;padding:12px">Entrar</button>
    <button class="btn" type="button" id="l-signup" style="justify-content:center">Primera vez: crear mi contraseña</button>
  </form>

  <div id="app" hidden>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="res" aria-selected="true">Reservas</button>
      <button class="tab" role="tab" data-tab="meet" aria-selected="false">Meetups</button>
      <button class="tab" role="tab" data-tab="set" aria-selected="false">Pagos y WhatsApp</button>
    </div>

    <section id="tab-res">
      <div class="bar">
        <label class="f grow">Salida<select class="input" id="r-meetup"></select></label>
        <label class="f">Mostrar<select class="input" id="r-filter"><option value="active">Activas</option><option value="all">Todas</option></select></label>
        <button class="btn" id="r-release" title="Cancela reservas pendientes que no pagaron a tiempo">Liberar vencidas</button>
        <button class="btn" id="r-csv">Copiar lista</button>
      </div>
      <div class="stats" id="stats"></div>
      <div class="venue" id="venue" hidden></div>
      <div class="panel"><div class="scroll"><table>
        <thead><tr><th>Código</th><th>Nombre</th><th>WhatsApp</th><th>Estado</th><th>Reservó</th><th>Acciones</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div></div>
    </section>

    <section id="tab-meet" hidden>
      <div class="mlist" id="mlist"></div>
      <form class="formcard" id="mform">
        <h3 id="mform-h">Nueva salida</h3>
        <input type="hidden" id="m-id">
        <div class="grid2">
          <label class="f">Nombre<input class="input" id="m-title" required placeholder="Girls&matcha"></label>
          <label class="f">Temática<select class="input" id="m-theme"><option value="matcha">matcha</option><option value="views">views</option><option value="books">books</option><option value="ceramics">ceramics</option><option value="beach">beach</option><option value="coffee">coffee</option><option value="other">otra</option></select></label>
        </div>
        <div class="grid3">
          <label class="f">Ciudad<select class="input" id="m-city"><option>San Salvador</option><option>Santa Tecla</option><option>Antiguo Cuscatlán</option><option>Santa Ana</option><option>La Libertad</option></select></label>
          <label class="f">Zona (pública)<input class="input" id="m-zone" required placeholder="San Benito"></label>
          <label class="f">Fecha y hora (SV)<input class="input" id="m-start" type="datetime-local" required></label>
        </div>
        <label class="f">Lugar exacto (privado: solo va en el mensaje de confirmación)<input class="input" id="m-venue" placeholder="Café X, Calle La Reforma #123 — mesa larga a nombre de Girls&"></label>
        <label class="f">Descripción (pública)<textarea class="input" id="m-desc" rows="2"></textarea></label>
        <label class="f">Descripción en inglés (opcional)<textarea class="input" id="m-desc-en" rows="2"></textarea></label>
        <div class="grid3">
          <label class="f">Cupos<input class="input" id="m-cap" type="number" min="1" max="60" value="12" required></label>
          <label class="f">Reserva ($)<input class="input" id="m-price" type="number" min="0" step="0.5" value="5" required></label>
          <label class="f">Estado<select class="input" id="m-status"><option value="open">Abierta (visible)</option><option value="draft">Borrador (oculta)</option><option value="closed">Cerrada</option><option value="done">Realizada</option><option value="cancelled">Cancelada</option></select></label>
        </div>
        <div style="display:flex;gap:10px"><button class="btn btn-primary" type="submit">Guardar salida</button><button class="btn" type="button" id="m-new">Limpiar</button></div>
      </form>
    </section>

    <section id="tab-set" hidden>
      <form class="formcard" id="sform">
        <h3>Datos de pago y contacto</h3>
        <p class="small" style="margin:0">Esto es lo que ve cada chica al reservar. Cambia los valores de ejemplo antes de compartir el sitio.</p>
        <label class="f">Tu WhatsApp (con 503, sin espacios)<input class="input" id="s-wa" inputmode="numeric" pattern="503[0-9]{8}" required></label>
        <div class="grid2">
          <label class="f">Banco<input class="input" id="s-bank" required></label>
          <label class="f">Titular<input class="input" id="s-holder" required></label>
          <label class="f">Tipo de cuenta<select class="input" id="s-type"><option>Ahorro</option><option>Corriente</option></select></label>
          <label class="f">Número de cuenta<input class="input" id="s-number" required></label>
        </div>
        <label class="f">Instrucciones de pago<textarea class="input" id="s-instr" rows="2" required></textarea></label>
        <label class="f" style="max-width:220px">Horas para pagar<input class="input" id="s-hold" type="number" min="1" max="96" required></label>
        <div><button class="btn btn-primary" type="submit">Guardar</button></div>
      </form>
    </section>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient("https://zpkcxqdvslpxtxbrcytq.supabase.co", "sb_publishable_nn3mgaAvQNQsly5Hwz_51Q_6UMzNNlC");
const TZ = "America/El_Salvador";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (iso, o) => new Intl.DateTimeFormat("es-SV", { timeZone: TZ, ...o }).format(new Date(iso));
const when = iso => fmt(iso,{weekday:"long",day:"numeric",month:"long"}) + " a las " + fmt(iso,{hour:"numeric",minute:"2-digit"});
const LABEL = { pending:"Pendiente de pago", paid:"Pagada", waitlist:"Lista de espera", cancelled:"Cancelada", attended:"Asistió", no_show:"No llegó" };
let meetups = [], settings = null, rows = [];

function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2400); }
const wa = (num, text) => "https://wa.me/" + num + "?text=" + encodeURIComponent(text);
const prettyPhone = n => "+" + n.slice(0,3) + " " + n.slice(3,7) + " " + n.slice(7);

/* ---------- auth ---------- */
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session){ $("#login").hidden = false; $("#app").hidden = true; $("#logout").hidden = true; $("#who").textContent=""; return; }
  const { data: ok } = await sb.rpc("is_admin");
  if (!ok){ $("#login").hidden = false; $("#l-msg").textContent = "Este correo no tiene acceso al panel."; await sb.auth.signOut(); return; }
  $("#login").hidden = true; $("#app").hidden = false; $("#logout").hidden = false; $("#who").textContent = session.user.email;
  await Promise.all([loadMeetups(), loadSettings()]);
  await loadRows();
}
$("#login").addEventListener("submit", async e => {
  e.preventDefault(); $("#l-msg").className="msg"; $("#l-msg").textContent="";
  const { error } = await sb.auth.signInWithPassword({ email: $("#l-email").value.trim(), password: $("#l-pass").value });
  if (error){ $("#l-msg").textContent = error.message.includes("Invalid") ? "Correo o contraseña incorrectos. Si es tu primera vez, usa “crear mi contraseña”." : error.message; return; }
  boot();
});
$("#l-signup").addEventListener("click", async () => {
  const email = $("#l-email").value.trim(), password = $("#l-pass").value;
  if (!email || password.length < 8){ $("#l-msg").textContent = "Escribe tu correo y una contraseña de al menos 8 caracteres."; return; }
  const { data, error } = await sb.auth.signUp({ email, password });
  if (error){ $("#l-msg").textContent = error.message.includes("registered") ? "Ese correo ya tiene contraseña. Usa Entrar." : error.message; return; }
  if (data.session) return boot();
  $("#l-msg").className="msg ok"; $("#l-msg").textContent = "Cuenta creada. Ahora toca Entrar.";
});
$("#logout").addEventListener("click", async () => { await sb.auth.signOut(); boot(); });

/* ---------- tabs ---------- */
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === t));
  ["res","meet","set"].forEach(n => $("#tab-"+n).hidden = n !== t.dataset.tab);
  if (t.dataset.tab === "res") loadRows();
}));

/* ---------- data ---------- */
async function loadMeetups(){
  const { data, error } = await sb.from("meetups").select("*").order("starts_at", { ascending: false });
  if (error) return toast("No se pudieron cargar las salidas");
  meetups = data;
  const sel = $("#r-meetup"), prev = sel.value;
  const upcoming = [...meetups].sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at)).find(m => new Date(m.starts_at) > new Date() && m.status !== "cancelled");
  sel.innerHTML = meetups.map(m => `<option value="${m.id}">${esc(m.title)} · ${esc(fmt(m.starts_at,{day:"numeric",month:"short",year:"numeric"}))} · ${esc(m.zone)}${m.status!=="open"?" ("+m.status+")":""}</option>`).join("") + `<option value="none">Sin fecha (interesadas)</option>`;
  sel.value = prev && [...sel.options].some(o=>o.value===prev) ? prev : (upcoming?.id || sel.options[0]?.value);
  renderMeetupList();
}
async function loadSettings(){
  const { data } = await sb.from("settings").select("*").eq("id",1).single();
  settings = data; if (!data) return;
  $("#s-wa").value = data.whatsapp_number; $("#s-bank").value = data.bank_name; $("#s-holder").value = data.account_holder;
  $("#s-type").value = data.account_type; $("#s-number").value = data.account_number; $("#s-instr").value = data.payment_instructions; $("#s-hold").value = data.hold_hours;
}
async function loadRows(){
  const id = $("#r-meetup").value; if (!id) return;
  let q = sb.from("reservations").select("*").order("created_at");
  q = id === "none" ? q.is("meetup_id", null) : q.eq("meetup_id", id);
  const { data, error } = await q;
  if (error) return toast("No se pudieron cargar las reservas");
  rows = data; render();
}
$("#r-meetup").addEventListener("change", loadRows);
$("#r-filter").addEventListener("change", render);

function current(){ return meetups.find(m => m.id === $("#r-meetup").value); }

function render(){
  const m = current();
  const c = s => rows.filter(r => r.status === s).length;
  const paid = c("paid") + c("attended"), pend = c("pending"), wait = c("waitlist");
  const cap = m?.capacity || 0, price = Number(m?.price || 0);
  const seat = cap ? Math.max(cap - paid - pend, 0) : 0;
  $("#stats").innerHTML = m ? `
    <div class="stat"><span>Pagadas</span><b>${paid} / ${cap}</b><div class="meter"><i style="width:${cap?paid/cap*100:0}%;background:var(--matcha-ink)"></i><i style="width:${cap?pend/cap*100:0}%;background:#E8C873"></i></div></div>
    <div class="stat"><span>Pendientes</span><b>${pend}</b></div>
    <div class="stat"><span>Cupos libres</span><b>${seat}</b></div>
    <div class="stat"><span>Lista de espera</span><b>${wait}</b></div>
    <div class="stat"><span>Cobrado</span><b>$${(paid*price).toFixed(2)}</b></div>` :
    `<div class="stat"><span>Interesadas sin fecha</span><b>${rows.filter(r=>r.status==="waitlist").length}</b></div>`;
  const v = $("#venue");
  if (m){ v.hidden = false; v.innerHTML = `<b>${esc(when(m.starts_at))}</b> · ${esc(m.zone)}, ${esc(m.city)} · Lugar exacto: ${m.venue_private ? esc(m.venue_private) : "<i>falta agregarlo en Meetups</i>"}`; } else v.hidden = true;

  const show = $("#r-filter").value === "all" ? rows : rows.filter(r => !["cancelled"].includes(r.status));
  if (!show.length){ $("#rows").innerHTML = `<tr><td colspan="6" class="empty">Todavía no hay reservas para esta salida.</td></tr>`; return; }
  const holdMs = (settings?.hold_hours || 24) * 3600e3;
  $("#rows").innerHTML = show.map(r => {
    const late = r.status === "pending" && Date.now() - new Date(r.created_at) > holdMs;
    const first = r.name.split(" ")[0];
    const msgs = waMessages(r, m, first);
    const acts = [];
    if (r.status === "pending") acts.push(`<button class="btn btn-sm btn-dark" data-act="paid" data-id="${r.id}">Marcar pagada</button>`, `<a class="btn btn-sm" target="_blank" rel="noopener" href="${esc(wa(r.whatsapp, msgs.remind))}">Recordar pago</a>`);
    if (r.status === "paid") acts.push(`<a class="btn btn-sm btn-wa" target="_blank" rel="noopener" href="${esc(wa(r.whatsapp, msgs.confirm))}">Enviar confirmación</a>`, `<a class="btn btn-sm" target="_blank" rel="noopener" href="${esc(wa(r.whatsapp, msgs.dayBefore))}">Recordatorio</a>`, `<button class="btn btn-sm" data-act="attended" data-id="${r.id}">Asistió</button>`, `<button class="btn btn-sm" data-act="no_show" data-id="${r.id}">No llegó</button>`);
    if (r.status === "waitlist") acts.push(m ? `<button class="btn btn-sm btn-dark" data-act="pending" data-id="${r.id}">Darle cupo</button>` : "", `<a class="btn btn-sm" target="_blank" rel="noopener" href="${esc(wa(r.whatsapp, m ? msgs.spot : msgs.newDates))}">${m ? "Avisar cupo" : "Avisar fechas"}</a>`);
    if (["pending","paid","waitlist"].includes(r.status)) acts.push(`<button class="btn btn-sm" data-act="cancelled" data-id="${r.id}">Cancelar</button>`);
    if (["cancelled","no_show","attended"].includes(r.status)) acts.push(`<button class="btn btn-sm" data-act="${m?'pending':'waitlist'}" data-id="${r.id}">Reactivar</button>`);
    return `<tr>
      <td class="code">${esc(r.code)}</td>
      <td><b>${esc(r.name)}</b>${r.lang==="en"?` <span class="pill s-waitlist" title="Reservó en inglés">EN</span>`:""}${r.theme_pref?`<div class="small">Prefiere: ${esc(r.theme_pref)}</div>`:""}${r.notes?`<div class="small">${esc(r.notes)}</div>`:""}</td>
      <td style="white-space:nowrap"><a href="${esc(wa(r.whatsapp,""))}" target="_blank" rel="noopener">${esc(prettyPhone(r.whatsapp))}</a></td>
      <td><span class="pill s-${r.status}">${LABEL[r.status]}</span>${late?`<div class="late">Venció el plazo</div>`:""}</td>
      <td class="small" style="white-space:nowrap">${esc(fmt(r.created_at,{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}))}</td>
      <td><div class="acts">${acts.join("")}</div></td></tr>`;
  }).join("");
}

function waMessagesEn(r, m, first){
  const site = location.origin + location.pathname.replace(/admin\.html$/,"") + "?lang=en";
  if (!m) return { newDates: `Hi ${first}! 💕 It's Girls& El Salvador. New dates are open: ${site}#meetups Want us to save you a spot?` };
  const d = new Intl.DateTimeFormat("en-US",{timeZone:TZ,weekday:"long",month:"long",day:"numeric"}).format(new Date(m.starts_at)) + " at " + new Intl.DateTimeFormat("en-US",{timeZone:TZ,hour:"numeric",minute:"2-digit"}).format(new Date(m.starts_at));
  const acct = settings.account_type === "Corriente" ? "checking" : "savings";
  const pay = `${settings.bank_name}, ${acct} account ${settings.account_number}, holder ${settings.account_holder}`;
  return {
    remind: `Hi ${first}! 💕 This is Girls& about your booking for ${m.title} (${d}). Your code is ${r.code}. To confirm your spot, just send the $${Number(m.price).toFixed(0)} transfer: ${pay}. Send me the receipt here and you're all set.`,
    confirm: `${first}, your spot is confirmed! ✨\n\n${m.title}\n📅 ${d}\n📍 ${m.venue_private || m.zone + ", " + m.city}\n\nCome 10 minutes early and ask for the Girls& table. Everyone pays for what they order. If you can't make it, let me know 48 hours ahead and we'll move your $5 to another date. See you there! 💕`,
    dayBefore: `Hi ${first}! ${m.title} is tomorrow 💕\n📅 ${d}\n📍 ${m.venue_private || m.zone}\nSee you there. If you can't make it after all, let me know today so I can give your spot to someone on the waitlist.`,
    spot: `Hi ${first}! 💕 A spot opened up for ${m.title} (${d}). Want it? If so, transfer $${Number(m.price).toFixed(0)} to ${pay} with your code ${r.code} and send me the receipt. I'll hold it for 24 hours.`
  };
}

function waMessages(r, m, first){
  if (r.lang === "en") return waMessagesEn(r, m, first);
  if (!m) return { newDates: `¡Hola ${first}! 💕 Soy de Girls& El Salvador. Ya abrimos nuevas fechas: ${location.origin}${location.pathname.replace(/admin\.html$/,"")}#meetups ¿Te apartamos un lugar?` };
  const d = when(m.starts_at);
  return {
    remind: `¡Hola ${first}! 💕 Te escribo de Girls& por tu reserva para ${m.title} (${d}). Tu código es ${r.code}. Para confirmar tu lugar solo falta la transferencia de $${Number(m.price).toFixed(0)}: ${settings.bank_name}, cuenta ${settings.account_type.toLowerCase()} ${settings.account_number} a nombre de ${settings.account_holder}. Me mandás el comprobante por aquí y listo.`,
    confirm: `¡${first}, tu lugar está confirmado! ✨\n\n${m.title}\n📅 ${d}\n📍 ${m.venue_private || m.zone + ", " + m.city}\n\nLlegá con 10 minutos de anticipación y preguntá por la mesa de Girls&. Cada quien paga lo que consume. Si no podés llegar, avisame con 48 horas y pasamos tus $5 a otra fecha. ¡Nos vemos! 💕`,
    dayBefore: `¡Hola ${first}! Mañana es ${m.title} 💕\n📅 ${d}\n📍 ${m.venue_private || m.zone}\nTe espero. Si al final no podés, avisame hoy para darle tu lugar a alguien de la lista de espera.`,
    spot: `¡Hola ${first}! 💕 Se liberó un cupo para ${m.title} (${d}). ¿Lo querés? Si sí, transferí $${Number(m.price).toFixed(0)} a ${settings.bank_name}, cuenta ${settings.account_type.toLowerCase()} ${settings.account_number} (${settings.account_holder}), con tu código ${r.code}, y me mandás el comprobante. Te lo guardo 24 horas.`
  };
}

$("#rows").addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const st = b.dataset.act;
  const patch = { status: st };
  if (st === "paid") patch.paid_at = new Date().toISOString();
  if (st === "pending") patch.created_at = new Date().toISOString(); // restart the payment window
  b.disabled = true;
  const { error } = await sb.from("reservations").update(patch).eq("id", b.dataset.id);
  if (error) { b.disabled = false; return toast("No se pudo actualizar"); }
  toast(LABEL[st]); loadRows();
});

$("#r-release").addEventListener("click", async () => {
  const { data, error } = await sb.rpc("release_expired_holds");
  if (error) return toast("No se pudo liberar");
  toast(data ? `${data} reserva(s) vencidas canceladas` : "No hay reservas vencidas"); loadRows();
});
$("#r-csv").addEventListener("click", async () => {
  const m = current();
  const list = rows.filter(r => ["paid","attended"].includes(r.status));
  const text = `${m ? m.title + " · " + when(m.starts_at) : "Interesadas"}\n` + (list.length ? list : rows).map((r,i) => `${i+1}. ${r.name} (${prettyPhone(r.whatsapp)})`).join("\n");
  try { await navigator.clipboard.writeText(text); toast("Lista copiada"); } catch { toast("No se pudo copiar"); }
});

/* ---------- meetups ---------- */
function renderMeetupList(){
  $("#mlist").innerHTML = meetups.length ? meetups.map(m => `<div class="mrow"><div class="grow"><b>${esc(m.title)}</b> · ${esc(when(m.starts_at))}<div class="small">${esc(m.zone)}, ${esc(m.city)} · ${m.capacity} cupos · $${Number(m.price).toFixed(2)} · ${esc(m.status)}</div></div><button class="btn btn-sm" data-edit="${m.id}">Editar</button></div>`).join("") : `<p class="small">Aún no hay salidas.</p>`;
}
const toLocalInput = iso => { const d = new Date(new Date(iso).getTime() - 6*3600e3); return d.toISOString().slice(0,16); };
$("#mlist").addEventListener("click", e => {
  const b = e.target.closest("[data-edit]"); if (!b) return;
  const m = meetups.find(x => x.id === b.dataset.edit);
  $("#mform-h").textContent = "Editar " + m.title;
  $("#m-id").value = m.id; $("#m-title").value = m.title; $("#m-theme").value = m.theme; $("#m-city").value = m.city; $("#m-zone").value = m.zone;
  $("#m-start").value = toLocalInput(m.starts_at); $("#m-venue").value = m.venue_private || ""; $("#m-desc").value = m.description || ""; $("#m-desc-en").value = m.description_en || "";
  $("#m-cap").value = m.capacity; $("#m-price").value = m.price; $("#m-status").value = m.status;
  $("#mform").scrollIntoView({ behavior:"smooth" });
});
$("#m-new").addEventListener("click", () => { $("#mform").reset(); $("#m-id").value=""; $("#mform-h").textContent="Nueva salida"; });
$("#mform").addEventListener("submit", async e => {
  e.preventDefault();
  const rec = { title: $("#m-title").value.trim(), theme: $("#m-theme").value, city: $("#m-city").value, zone: $("#m-zone").value.trim(),
    starts_at: $("#m-start").value + ":00-06:00", venue_private: $("#m-venue").value.trim() || null, description: $("#m-desc").value.trim() || null, description_en: $("#m-desc-en").value.trim() || null,
    capacity: +$("#m-cap").value, price: +$("#m-price").value, status: $("#m-status").value };
  const id = $("#m-id").value;
  const { error } = id ? await sb.from("meetups").update(rec).eq("id", id) : await sb.from("meetups").insert(rec);
  if (error) return toast("No se pudo guardar: " + error.message);
  toast("Salida guardada"); $("#m-new").click(); loadMeetups();
});

/* ---------- settings ---------- */
$("#sform").addEventListener("submit", async e => {
  e.preventDefault();
  const rec = { whatsapp_number: $("#s-wa").value.replace(/\D/g,""), bank_name: $("#s-bank").value.trim(), account_holder: $("#s-holder").value.trim(),
    account_type: $("#s-type").value, account_number: $("#s-number").value.trim(), payment_instructions: $("#s-instr").value.trim(), hold_hours: +$("#s-hold").value, updated_at: new Date().toISOString() };
  const { error } = await sb.from("settings").update(rec).eq("id", 1);
  if (error) return toast("No se pudo guardar");
  toast("Guardado"); loadSettings();
});

boot();
</script>
